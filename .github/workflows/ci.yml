name: CI

on:
  push:
    branches:
      - main
      - issue20-mobile-inventory
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo dependency check
        run: npx expo install --check

      - name: Static checks
        run: npm run check
